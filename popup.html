<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050806">
  <title>STASH</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <header class="top">
      <div class="brand">
        <span class="mark" aria-hidden="true">S</span>
        <div class="brand-text">
          <span class="brand-title">STASH</span>
          <span class="brand-tag">TRENCHES TERMINAL</span>
        </div>
      </div>
      <span class="version">v1.0.0</span>
    </header>

    <section class="quick-links" aria-label="Ссылки STASH">
      <div class="quick-links-title">STASH // NETWORK</div>
      <a class="quick-link" href="https://t.me/v3lm0ur" target="_blank" rel="noopener noreferrer">
        <span class="quick-link-mark">↗</span>
        <span class="quick-link-copy">
          <strong>Создатель</strong>
          <small>Telegram · @v3lm0ur</small>
        </span>
      </a>
      <a class="quick-link" href="https://stashwiki.xyz" target="_blank" rel="noopener noreferrer">
        <span class="quick-link-mark">↗</span>
        <span class="quick-link-copy">
          <strong>STASH Wiki</strong>
          <small>Основной сайт проекта</small>
        </span>
      </a>
    </section>

    <div class="section-title">
      <span>MODULES</span>
      <span id="active-count" class="active-pill">0 / 7 ACTIVE</span>
    </div>

    <section id="module-list" class="module-list" aria-label="Модули"></section>

    <footer>
      <button id="open-settings" class="settings-link" type="button">
        <span>ПОЛНЫЕ НАСТРОЙКИ</span>
        <span class="settings-arrow">↗</span>
      </button>
      <div class="foot-meta">
        <span id="status" class="status" role="status" aria-live="polite">LOCAL CONFIG</span>
      </div>
    </footer>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
